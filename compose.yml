services:
  llama-server:
    image: localhost/llama-run:latest
    container_name: llama-server
    restart: unless-stopped
    security_opt:
      - seccomp=unconfined
    userns_mode: keep-id
    cap_add:
      - SYS_PTRACE
    ipc: host
    shm_size: 16G  # Recommended for large models
    group_add:
      - video  # Required for GPU access
    # NVIDIA options
    #devices:
    #  - nvidia.com/gpu=all
    # AMD-only options
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    # END AMD
    ports:
      - "8080:8080"
    volumes:
      - ./cache:/cache:Z
      - ./scripts:/scripts:Z
    environment:
      - LLAMA_ARG_HOST=0.0.0.0
      - HSA_OVERRIDE_GFX_VERSION=11.0.2
      - HF_XET_HIGH_PERFORMANCE=1
      - HF_HUB_CACHE=/cache
      # loaded from .env, generated by rc.prep:
      - HF_TOKEN
      - MODEL
      - LLAMA_ARGS
    entrypoint: tini -- /scripts/entry.sh
    #entrypoint: tini -- /scripts/entry_sleep.sh
    stdin_open: false
    tty: false
